<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jogo da Memória |  Memes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
  <div class="stats">
    <div>🎴 Movimentos: <span id="moveCount">0</span></div>
    <div>⏱️ Tempo: <span id="timerDisplay">0</span>s</div>
    <button id="restartBtn">🔄 Reiniciar</button>
  </div>

  <div class="board" id="gameBoard"></div>

  <div class="ranking">
    <h3>🏆 Ranking (menos movimentos)</h3>
    <ul class="ranking-list" id="rankingList">
      <li class="empty-ranking">Nenhuma pontuação ainda</li>
    </ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
